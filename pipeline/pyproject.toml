[project]
name = "marswalk-pipeline"
version = "0.1.0"
description = "Offline preprocessing pipeline for Marswalk Planner (docs/specs/02 §A, §C; TASK-03, TASK-04)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]  # the manifest validator needs it (BD-21)

[project.optional-dependencies]
# Geo stack from docs/specs/02 §B. Kept optional so CI can run the (skipped) tests without GDAL.
# Install the full environment with environment.yml (conda) instead.
geo = ["rasterio", "numpy", "pyproj>=3.4"]
validate = ["jsonschema>=4.0"]
dev = ["pytest", "jsonschema>=4.0"]

[project.scripts]
validate-manifest = "marswalk_pipeline.validate_manifest:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pipeline/work holds git-ignored downloads and scratch scripts (symlinked to the SSD); never collect them.
norecursedirs = ["work", "cache", ".*", "node_modules"]
pythonpath = ["src"]
