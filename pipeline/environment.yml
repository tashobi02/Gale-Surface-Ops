# Conda environment for the pipeline (docs/specs/02 §B: Python 3.11+, GDAL ≥ 3.6, rasterio, numpy, pyproj ≥ 3.4).
# Not installed yet. Create with: mamba env create -f pipeline/environment.yml
name: marswalk-pipeline
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - gdal>=3.6
  - rasterio
  - numpy
  - pyproj>=3.4
  - pytest
  - pip
  - pip:
      - -e .
