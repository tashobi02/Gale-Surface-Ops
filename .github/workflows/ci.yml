name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Package installs are the only network steps; no datasets are fetched.
      - run: make setup
      - run: make lint typecheck test docs-check
      - run: npm run -s build
