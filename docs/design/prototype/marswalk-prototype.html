<!doctype html>
<html lang="en" data-mode="ops" data-rm="0">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marswalk Surface Ops — design handoff prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=block">
<style>
/* ============ TOKENS (04 §C.1, §G) — primitives on :root, semantic layers per [data-mode] ============ */
:root{
  /* BRIEF primitives */
  --p-paper:#F7F5F0; --p-concrete:#E8E6E1; --p-steel:#CFCFCF; --p-ink:#1A1A1A; --p-ink-2:#5A5A5A;
  --p-charcoal:#282828; --p-charcoal-text-2:#A3A3A3; --p-signal:#E7553D; --p-signal-ink:#C2401F;
  /* OPS primitives */
  --p-void:#0B0D10; --p-panel:#14181D; --p-raised:#1C2128; --p-hairline:#2A313A; --p-edge:#5C6670;
  --p-text-1:#ECEFF2; --p-text-2:#A9B3BE; --p-text-3:#8592A0; --p-route:#4CC9F0;
  --p-nominal:#3DDC84; --p-caution:#FFB020; --p-warning:#FF4D4D; --p-advisory:#4CC9F0; --p-unknown:#B8A9FF;
  --p-warning-fill:#B3261E; --p-caution-fill:#FFB020;
  /* HUD primitives */
  --p-black:#000000; --p-white:#FFFFFF; --p-hud-warning:#FF6B6B;
  /* PRINT primitives (04 §C.1 lists four; the neutral three are PROPOSED — see handoff G-15) */
  --p-print-text:#111827; --p-print-caution:#9A5B00; --p-print-warning:#B42318; --p-print-nominal:#0E7A4F;
  --p-print-text-2:#4B5563; --p-print-edge:#6B7280; --p-print-hairline:#D1D5DB; --p-print-advisory:#1D4ED8; --p-print-unknown:#6D28D9;
  /* type stacks (04 §C.2). Product self-hosts WOFF2 (U-27); prototype loads Google Fonts */
  --f-display:"Chakra Petch","Arial Narrow",Arial,sans-serif;
  --f-ui:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  /* spacing / chamfer (04 §C.3) */
  --u:4px; --cut-s:8px; --cut-m:16px; --cut-l:48px;
}

/* ---- OPS ---- */
[data-mode="ops"]{
  --bg:var(--p-void); --panel:var(--p-panel); --raised:var(--p-raised); --hairline:var(--p-hairline); --edge:var(--p-edge);
  --text-1:var(--p-text-1); --text-2:var(--p-text-2); --text-3:var(--p-text-3); --route:var(--p-route);
  --nominal:var(--p-nominal); --caution:var(--p-caution); --warning:var(--p-warning); --advisory:var(--p-advisory); --unknown:var(--p-unknown);
  --warning-fill:var(--p-warning-fill); --on-warning-fill:#fff; --caution-fill:var(--p-caution-fill); --on-caution-fill:#000;
  --btn-fill:var(--p-text-1); --btn-text:var(--p-void); --focus:#fff; --gap:var(--p-void);
  --slab:var(--p-raised); --on-slab:var(--p-text-1); --slab-2:var(--p-text-2);
  color-scheme:dark;
}
/* ---- BRIEF ---- */
[data-mode="brief"]{
  --bg:var(--p-paper); --panel:var(--p-concrete); --raised:var(--p-concrete); --hairline:#CFCBC2; --edge:var(--p-ink-2);
  --text-1:var(--p-ink); --text-2:var(--p-ink-2); --text-3:var(--p-ink-2); --route:var(--p-ink);
  --nominal:#0E7A4F; --caution:#9A5B00; --warning:#B42318; --advisory:#1D4ED8; --unknown:#6D28D9;
  --warning-fill:#B42318; --on-warning-fill:#fff; --caution-fill:var(--p-signal); --on-caution-fill:var(--p-ink);
  --btn-fill:var(--p-signal); --btn-text:var(--p-ink); --accent:var(--p-signal); --accent-text:var(--p-signal-ink);
  --focus:var(--p-ink); --gap:var(--p-paper);
  --slab:var(--p-charcoal); --on-slab:var(--p-paper); --slab-2:var(--p-charcoal-text-2);
  --signal:var(--p-signal); --on-signal:var(--p-ink);
  color-scheme:light;
}
/* ---- HUD ---- */
[data-mode="hud"]{
  --bg:var(--p-black); --panel:var(--p-black); --raised:var(--p-black); --hairline:#2A313A; --edge:var(--p-text-2);
  --text-1:var(--p-white); --text-2:var(--p-text-2); --text-3:var(--p-text-2); --route:var(--p-advisory);
  --nominal:var(--p-nominal); --caution:var(--p-caution); --warning:var(--p-hud-warning); --advisory:var(--p-advisory); --unknown:var(--p-unknown);
  --warning-fill:var(--p-warning-fill); --on-warning-fill:#fff; --caution-fill:var(--p-caution-fill); --on-caution-fill:#000;
  --btn-fill:var(--p-white); --btn-text:var(--p-black); --focus:#fff; --gap:var(--p-black);
  --slab:var(--p-black); --on-slab:var(--p-white); --slab-2:var(--p-text-2);
  color-scheme:dark;
}
/* ---- PRINT ---- */
[data-mode="print"]{
  --bg:#fff; --panel:#fff; --raised:#fff; --hairline:var(--p-print-hairline); --edge:var(--p-print-edge);
  --text-1:var(--p-print-text); --text-2:var(--p-print-text-2); --text-3:var(--p-print-text-2); --route:var(--p-print-text);
  --nominal:var(--p-print-nominal); --caution:var(--p-print-caution); --warning:var(--p-print-warning); --advisory:var(--p-print-advisory); --unknown:var(--p-print-unknown);
  --warning-fill:var(--p-print-warning); --on-warning-fill:#fff; --caution-fill:#fff; --on-caution-fill:var(--p-print-text);
  --btn-fill:var(--p-print-text); --btn-text:#fff; --focus:#000; --gap:#fff;
  --slab:#111827; --on-slab:#fff; --slab-2:#D1D5DB;
  color-scheme:light;
}
/* HC toggle on EVA: switches to the HUD palette (04 §F "Glare") */
[data-mode="ops"][data-hc="1"]{
  --bg:#000; --panel:#000; --raised:#000; --text-1:#fff; --text-2:var(--p-text-2); --text-3:var(--p-text-2); --edge:var(--p-text-2);
  --nominal:var(--p-nominal); --caution:var(--p-caution); --warning:var(--p-hud-warning); --advisory:var(--p-advisory);
  --btn-fill:#fff; --btn-text:#000; --gap:#000; --slab:#000; --route:var(--p-advisory);
}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:14px/1.45 var(--f-ui);background:#0B0D10;color:#ECEFF2;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
svg{display:block}
.frame{position:relative;overflow:hidden;background:var(--bg);color:var(--text-1);font:14px/1.45 var(--f-ui);text-align:left}
.frame *{scrollbar-width:auto}
.frame ::-webkit-scrollbar{width:10px;height:10px}
.frame ::-webkit-scrollbar-thumb{background:var(--edge)}
.frame ::-webkit-scrollbar-track{background:var(--raised)}
.num,.val .num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums slashed-zero;font-feature-settings:"zero" 1,"tnum" 1;font-weight:500}
.disp{font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:-.01em}
.serif{font-family:var(--f-serif);font-size:17px;line-height:1.6;max-width:68ch}
.micro{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.code{font:500 11px/1.3 var(--f-mono);letter-spacing:.04em;color:var(--text-2);white-space:nowrap}
.t1{color:var(--text-1)}.t2{color:var(--text-2)}.t3{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}
.sp{flex:1}.nw{white-space:nowrap}

/* ============ FOCUS (04 §C.1: white 2px ring + 2px void gap) ============ */
:where(.frame) :focus{outline:none}
:where(.frame) :focus-visible{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--gap)}
.cutw{display:inline-flex;position:relative}
.cutw:has(:focus-visible){outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--gap)}
.cutw :focus-visible{outline:none;box-shadow:none}

/* ============ CHAMFERS (04 §C.3: clip-path + inner pseudo-element outline) ============ */
.cut{--cut:var(--cut-m);--fill:var(--panel);--line:var(--edge);position:relative;isolation:isolate;background:var(--line);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.cut::before{content:"";position:absolute;inset:1px;background:var(--fill);z-index:-1;pointer-events:none;
  clip-path:polygon(0 0,calc(100% - var(--cut) + .41px) 0,100% calc(var(--cut) - .41px),100% 100%,calc(var(--cut) - .41px) 100%,0 calc(100% - var(--cut) + .41px))}
.cut-s{--cut:var(--cut-s)}.cut-m{--cut:var(--cut-m)}.cut-l{--cut:var(--cut-l)}
.cut.fill-raised{--fill:var(--raised)}.cut.fill-bg{--fill:var(--bg)}.cut.line-hair{--line:var(--hairline)}
.cut.line-route{--line:var(--route)}.cut.line-t1{--line:var(--text-1)}.cut.noline{--line:var(--fill)}

/* ============ GRID, REGISTRATION MARKS, LIVERY STRIPE (04 §C.3) ============ */
.cgrid{background-image:linear-gradient(var(--hairline) 1px,transparent 1px),linear-gradient(90deg,var(--hairline) 1px,transparent 1px);background-size:32px 32px}
.reg{position:absolute;width:13px;height:13px;pointer-events:none;color:var(--text-3)}
.reg::before,.reg::after{content:"";position:absolute;background:currentColor}
.reg::before{left:6px;top:0;width:1px;height:13px}.reg::after{top:6px;left:0;height:1px;width:13px}
.stripe{display:block;height:4px;width:100%;background:linear-gradient(90deg,var(--text-1) 0 33.34%,var(--text-3) 33.34% 66.67%,var(--hairline) 66.67%)}
.meta{display:flex;align-items:center;gap:0;height:24px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--hairline);font:500 11px/24px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);white-space:nowrap;overflow:hidden}
.meta span+span::before{content:"·";margin:0 8px;color:var(--text-3)}
.meta .num{font-size:11px}
.meta .chip{height:14px;border:0;background:none;padding:0 2px}.meta .chip svg{width:8px;height:8px}
.linkbars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:-1px}.linkbars i{display:block;width:5px;background:var(--text-1)}.linkbars i.off{background:transparent;border:1px solid var(--text-3)}.linkbars i:nth-child(1){height:6px}.linkbars i:nth-child(2){height:10px}.linkbars i:nth-child(3){height:14px}

/* ============ PANEL / SPECIMEN CARD (04 §D.1, §B.3 P1–P3) ============ */
.panel{display:flex;flex-direction:column;min-width:0}
.panel>.stripe{flex:none}
.panel>.ph-h{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;min-height:28px;flex:none}
.panel>.pb{padding:4px 12px 12px;min-height:0;flex:1}
.mod{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.ttl{font:500 20px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:-.01em}
.h-sm{font:500 15px/1.2 var(--f-display);text-transform:uppercase}
.lbl{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3)}
.kv{display:grid;grid-template-columns:104px 1fr;gap:4px 8px;align-items:baseline}
.kv>.lbl{padding-top:2px}
.sel{--line:var(--route)}

/* ============ VALUES + PROVENANCE CHIPS (04 §C.1 chips, FR-15) ============ */
.val{display:inline-flex;align-items:baseline;gap:4px;white-space:nowrap}
.val .unit{font:400 .5em/1 var(--f-ui);color:var(--text-3);margin-left:.15em;font-feature-settings:normal}
.val.stale .num,.val.stale .unit{color:var(--text-3)}
.val .age{font:500 11px var(--f-mono);color:var(--text-3);margin-left:6px}
.val.loading{opacity:.5}
.ph{border-bottom:1px dotted currentColor}
.ph .num{letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border:1px solid var(--edge);background:var(--raised);color:var(--text-2);font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;vertical-align:middle;white-space:nowrap;align-self:center}
.chip svg{width:10px;height:10px;flex:none}
.chip.g{padding:0 4px;gap:0}
[data-mode="brief"] .chip,[data-mode="print"] .chip{background:var(--p-concrete)}
[data-mode="print"] .chip{background:#fff}
.chipbar{display:flex;flex-wrap:wrap;gap:6px}

/* ============ STATUS ICON + WORD (04 §A.3 #2: colour + shape + word + position) ============ */
.status{display:inline-flex;align-items:center;gap:6px;color:var(--text-1);font:700 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.status .sicon{width:18px;height:18px;flex:none}
.status[data-status="nominal"] .sicon{color:var(--nominal)}.status[data-status="caution"] .sicon{color:var(--caution)}
.status[data-status="warning"] .sicon{color:var(--warning)}.status[data-status="advisory"] .sicon{color:var(--advisory)}
.status[data-status="unknown"] .sicon{color:var(--unknown)}
.sicon{flex:none;width:20px;height:20px}
.sicon .sh{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:miter}
.sicon .pt{fill:currentColor;fill-opacity:.35}
.sicon .sy{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:square}
.sicon .sf{fill:currentColor}
.sicon.onfill{color:inherit}

/* ============ BUTTONS (04 §D.1; P8: look like buttons) ============ */
.btn{--cut:var(--cut-s);--fill:var(--raised);--line:var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:32px;padding:0 14px;border:0;
  font:600 13px/1 var(--f-ui);color:var(--text-1);text-transform:none;letter-spacing:.01em;clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)));background:var(--line);position:relative;isolation:isolate}
.btn::before{content:"";position:absolute;inset:1px;background:var(--fill);z-index:-1;pointer-events:none;
  clip-path:polygon(0 0,calc(100% - var(--cut) + .41px) 0,100% calc(var(--cut) - .41px),100% 100%,calc(var(--cut) - .41px) 100%,0 calc(100% - var(--cut) + .41px))}
.btn:active:not(:disabled),.btn.pressed{--fill:var(--text-1);color:var(--bg)}
.btn.primary{--fill:var(--btn-fill);--line:var(--btn-fill);color:var(--btn-text)}
.btn.primary:active:not(:disabled){--fill:var(--bg);color:var(--text-1);--line:var(--text-1)}
.btn.on{--fill:var(--text-1);color:var(--bg);--line:var(--text-1)}
.btn:disabled,.btn[aria-disabled="true"]{--fill:var(--bg);--line:var(--edge);color:var(--text-3);cursor:not-allowed}
.btn.err{--line:var(--warning);color:var(--warning)}
.btn.tall{min-height:44px}.btn.xl{min-height:56px;font-size:16px}
.btn .ic{width:16px;height:16px;flex:none}
.btn.xl .ic{width:22px;height:22px}
.btn.crit-w{--fill:var(--warning-fill);--line:var(--warning-fill);color:var(--on-warning-fill)}
.btn.crit-c{--fill:var(--caution-fill);--line:var(--caution-fill);color:var(--on-caution-fill)}
.btn.crit-w:active:not(:disabled),.btn.crit-c:active:not(:disabled){filter:invert(1)}
.btn.ghost{--fill:transparent;--line:transparent}
.btn.seg{min-height:28px;padding:0 10px;font:500 12px/1 var(--f-mono)}
.btn.sm{min-height:28px;padding:0 10px;font-size:12px}
.hold .hsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hold .hsvg path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:butt;opacity:.95}
.hold .hbase{opacity:.3}
.hold.done{--fill:var(--text-1);color:var(--bg)}
.hold .hword{display:inline-flex;align-items:center;gap:8px}
.holdnote{font:500 11px/1.2 var(--f-mono);color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.confirmbtn{animation:none}

/* ============ ALERT BAR (04 §D.2) ============ */
.alertslot{height:64px;flex:none;position:relative;border-bottom:1px solid var(--hairline)}
.alertbar{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 16px;font:700 18px/1.2 var(--f-ui)}
.alertbar .atext{flex:1;min-width:0}
.alertbar .sicon{width:28px;height:28px;flex:none}
.alertbar[data-level="warning"]{background:var(--warning-fill);color:var(--on-warning-fill)}
.alertbar[data-level="caution"]{background:var(--caution-fill);color:var(--on-caution-fill);
  background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.9) 0 6px,transparent 6px 12px),none;background-size:100% 6px,auto;background-repeat:no-repeat;background-position:top,0 0;box-shadow:inset 0 -6px 0 0 transparent}
.alertbar[data-level="caution"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(135deg,rgba(0,0,0,.9) 0 6px,transparent 6px 12px);pointer-events:none}
.alertbar[data-level="advisory"]{background:var(--raised);color:var(--text-1);box-shadow:inset 4px 0 0 var(--advisory)}
.alertbar[data-level="advisory"] .sicon{color:var(--advisory)}
.alertbar .abtn{--cut:var(--cut-s);min-height:40px}
.alertbar.flash{animation:flash2 .5s steps(1,end) 2}
.alertbar.pulse{animation:pulse1 .6s ease-out 1}
.alertbar.acked .atext::after{content:" — acknowledged";font-weight:500;opacity:.9}
.alertbar .cnt{font:700 13px/1 var(--f-mono);padding:0 8px;min-height:40px}
.eva .alertbar{font-size:22px}
@keyframes flash2{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
@keyframes pulse1{0%{filter:brightness(1)}40%{filter:brightness(1.35)}100%{filter:brightness(1)}}
[data-rm="1"] *{animation:none!important;transition:none!important}
.alertlist{position:absolute;z-index:8;right:8px;top:68px;width:min(420px,calc(100% - 16px));max-height:260px;overflow:auto}
.alertlist li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--hairline)}
.alertlist li.cleared{opacity:.6}

/* ============ TABLES, INPUTS ============ */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:500 11px/1.3 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-3);text-align:left;padding:4px 8px;border-bottom:1px solid var(--edge)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--hairline);vertical-align:top}
.field{display:flex;flex-direction:column;gap:2px}
.inp{display:flex;align-items:center;gap:6px;min-height:32px;padding:0 8px;background:var(--raised);border:1px solid var(--edge);font:500 14px/1 var(--f-mono);color:var(--text-1);width:100%}
.inp.err{border-color:var(--warning)}
.inp .unit{font:400 12px var(--f-ui);color:var(--text-3)}
.inp input{flex:1;min-width:0;background:transparent;border:0;color:inherit;font:inherit;outline:0;padding:0}
.inp:focus-within{outline:2px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 2px var(--gap)}
.errtxt{font:500 12px/1.3 var(--f-ui);color:var(--warning);display:flex;gap:6px;align-items:flex-start}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 4px;background:none;border:0;color:var(--text-1);font:500 13px var(--f-ui);text-align:left}
.toggle .sw{width:34px;height:18px;border:1px solid var(--edge);background:var(--raised);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text-3)}
.toggle[aria-pressed="true"] .sw{background:var(--text-1);border-color:var(--text-1)}
.toggle[aria-pressed="true"] .sw::after{left:18px;background:var(--bg)}
.toggle:disabled{color:var(--text-3);cursor:not-allowed}
.skel{background:linear-gradient(90deg,var(--hairline) 0,var(--raised) 50%,var(--hairline) 100%);background-size:200% 100%;height:12px;animation:skel 1.4s linear infinite}
@keyframes skel{to{background-position:-200% 0}}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px solid var(--edge);font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--text-2);white-space:nowrap}
.tag.t2s{border-style:dashed;color:var(--text-1)}
.tag.dark{background:var(--text-1);color:var(--bg);border-color:var(--text-1)}
.hatch-c{background:repeating-linear-gradient(135deg,currentColor 0 2px,transparent 2px 6px)}
.toast{position:absolute;z-index:9;left:50%;top:72px;transform:translateX(-50%);min-width:240px;max-width:90%;padding:10px 14px;background:var(--raised);border:1px solid var(--edge);display:flex;gap:8px;align-items:center;font:500 13px var(--f-ui)}
.dashed{border-style:dashed!important}
.scroll-ct{font:500 11px var(--f-mono);color:var(--text-3);padding:2px 12px}
.protoflag{position:absolute;z-index:30;left:50%;bottom:0;transform:translateX(-50%);padding:1px 8px;background:var(--bg);color:var(--text-3);font:500 11px/16px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--hairline);border-bottom:0;pointer-events:none;white-space:nowrap}
.t2scope{position:absolute;z-index:30;top:6px;left:6px;padding:0 6px;height:18px;background:var(--bg);color:var(--text-1);border:1px dashed var(--text-1);font:700 11px/16px var(--f-mono);letter-spacing:.06em;pointer-events:none}
@media print{
  body.printing>*:not(.print-target){display:none!important}
}

.tbl.tight td,.tbl.tight th{padding:2px 6px;line-height:1.25}

/* ============ MAP (SCHEMATIC) ============ */
[data-mode="ops"]{--map-out:#0B0D10;--map-base:#434A53;--map-ct:#fff}
[data-mode="brief"]{--map-out:#E8E6E1;--map-base:#B9B6AE;--map-ct:#000}
[data-mode="print"]{--map-out:#F3F4F6;--map-base:#D6D6D6;--map-ct:#000}
[data-mode="hud"]{--map-out:#000;--map-base:#2B3036;--map-ct:#fff}
.mapsvg{display:block;width:100%;height:100%;background:var(--map-out)}
.m-out{fill:var(--map-out)}.hsb{fill:var(--map-base)}
.hs0{fill:#000;fill-opacity:.34}.hs1{fill:#000;fill-opacity:.22}.hs2{fill:#000;fill-opacity:.1}.hs4{fill:#fff;fill-opacity:.1}.hs5{fill:#fff;fill-opacity:.2}.hs6{fill:#fff;fill-opacity:.3}
.ct,.ct-i{fill:none;stroke:var(--map-ct);vector-effect:non-scaling-stroke;stroke-width:.7;stroke-opacity:.2}.ct-i{stroke-opacity:.42}
.sl1{fill:#FDE7A9;fill-opacity:.4}.sl2{fill:#F5A524;fill-opacity:.55}.sl3{fill:url(#pt-sl3)}.sl4{fill:url(#pt-sl4)}
#mw-ti ellipse{fill:#C9A66B;fill-opacity:.5;stroke:#C9A66B;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.shd{fill:url(#pt-hatch45);color:var(--text-2);opacity:.45}
#mw-shadow-edge{fill:none;stroke:var(--text-2);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke;opacity:.75}
.iso{fill:none;stroke:var(--text-1);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.85}
.ovr{fill:url(#pt-caut);opacity:.4}
.m-aoi{fill:none;stroke:var(--text-2);stroke-width:1.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.m-trav{fill:none;stroke:#E8EDF2;stroke-opacity:.6;stroke-dasharray:5 4;stroke-width:1.5;vector-effect:non-scaling-stroke}
.m-routecase{fill:none;stroke:var(--bg);stroke-width:8;vector-effect:non-scaling-stroke;stroke-linejoin:miter}
.m-route{fill:none;stroke:var(--route);stroke-width:4;vector-effect:non-scaling-stroke;stroke-linejoin:miter}
.m-route.back{stroke-dasharray:10 6;stroke-width:2.5;opacity:.75}.m-route.ghost{opacity:.45}
.m-noroute{fill:none;stroke:var(--unknown);stroke-width:3;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.m-pr1case{fill:none;stroke:var(--bg);stroke-width:6;vector-effect:non-scaling-stroke}
.m-pr1{fill:none;stroke:var(--text-1);stroke-width:2.5;stroke-dasharray:8 5;vector-effect:non-scaling-stroke}
.m-hab{fill:var(--text-1);stroke:var(--bg);stroke-width:2}
.m-lab{font:500 11px var(--f-mono);fill:var(--text-1);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:miter;text-transform:uppercase;letter-spacing:.04em}
.m-lab.t3,.m-sol,.m-iso-lab{fill:var(--text-2)}
.m-sol,.m-iso-lab{font:500 11px var(--f-mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px}
.m-wp{fill:var(--route);stroke:var(--bg);stroke-width:2}.m-wp.bad{fill:var(--bg);stroke:var(--warning);stroke-width:3}
.m-badx{stroke:var(--warning);stroke-width:2.5;fill:none}.m-selring{fill:none;stroke:var(--focus);stroke-width:3}
.m-wpn{font:600 13px var(--f-mono);fill:var(--bg)}
.m-plate{fill:var(--raised);stroke:var(--edge)}
.m-chev{fill:var(--text-1);stroke:var(--bg);stroke-width:2}.m-chev.stale{fill:none;stroke:var(--text-1);stroke-dasharray:4 3}.m-lab.stale{fill:var(--text-2)}
.m-veh path{fill:var(--text-1);stroke:var(--bg);stroke-width:2}.m-veh .m-vd{stroke:var(--bg);fill:none}
.m-rdv{fill:none;stroke:var(--text-1);stroke-width:2}
.m-cross{fill:none;stroke:var(--text-1);stroke-width:1.5}
.m-stop{cursor:grab}.m-stop:focus-visible{outline:none}.m-stop:focus-visible .m-wp{stroke:var(--focus);stroke-width:4}
.mapbox{position:relative;overflow:hidden;background:var(--map-out)}
.mapbox .maptag{position:absolute;right:8px;bottom:8px;z-index:3;padding:2px 8px;background:var(--bg);border:1px solid var(--edge);font:500 11px/16px var(--f-mono);color:var(--text-1);text-transform:uppercase;letter-spacing:.04em}
.mapbox .north{position:absolute;right:8px;top:8px;z-index:3;padding:2px 8px;background:var(--bg);border:1px solid var(--edge);font:500 11px/16px var(--f-mono);color:var(--text-1)}
.mapbox .scalebar{position:absolute;left:8px;bottom:8px;z-index:3;display:flex;flex-direction:column;gap:2px;padding:4px 6px;background:var(--bg);border:1px solid var(--edge);font:500 11px var(--f-mono)}
.mapbox .scalebar i{display:block;height:6px;border:1px solid var(--text-1);border-top:0}
.legend{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-2)}
.legend .sw{display:inline-block;width:14px;height:10px;border:1px solid var(--edge);vertical-align:-1px;margin-right:6px}

/* ============ SHELL ============ */
body.shell{margin:0;overflow:hidden;height:100vh;display:grid;grid-template-columns:216px 1fr;grid-template-rows:48px 1fr;background:#0B0D10}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 12px;background:#14181D;border-bottom:1px solid #5C6670;overflow-x:auto}
#topbar .brandmark{width:22px;height:22px;flex:none}
#topbar .route{font:500 12px var(--f-mono);color:#A9B3BE;white-space:nowrap}
#topbar .sep{flex:1}
#rail{background:#14181D;border-right:1px solid #2A313A;overflow-y:auto;padding:8px 0}
#rail a{display:flex;align-items:center;gap:8px;padding:9px 16px;color:#A9B3BE;text-decoration:none;font:500 13px var(--f-ui);border-left:3px solid transparent}
#rail a[aria-current="page"]{color:#ECEFF2;border-left-color:#ECEFF2;background:#1C2128;font-weight:700}
#rail a:hover{color:#ECEFF2}
#rail .grp{padding:14px 16px 4px;font:500 11px var(--f-mono);color:#8592A0;text-transform:uppercase;letter-spacing:.06em}
#rail a.sub{padding-left:30px;font-size:12px}
#main{overflow:auto;padding:20px 24px 80px;scroll-behavior:auto}
#main h1{font:500 28px/1.1 var(--f-display);text-transform:uppercase;margin-bottom:6px}
#main h2{font:500 20px/1.2 var(--f-display);text-transform:uppercase;margin:28px 0 10px}
#main h3{font:500 15px/1.2 var(--f-display);text-transform:uppercase;margin:18px 0 8px}
#main p.lead{max-width:80ch;color:#A9B3BE;margin:6px 0 14px}
#main table.sp{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
#main table.sp th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:#8592A0;text-align:left;padding:6px 8px;border-bottom:1px solid #5C6670}
#main table.sp td{padding:6px 8px;border-bottom:1px solid #2A313A;vertical-align:top}
#main a{color:#4CC9F0}
.shellbtn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;background:#1C2128;border:1px solid #5C6670;color:#ECEFF2;font:500 12px var(--f-mono);cursor:pointer;white-space:nowrap}
.shellbtn[aria-pressed="true"],.shellbtn.on{background:#ECEFF2;color:#0B0D10;border-color:#ECEFF2}
.shellbtn:focus-visible,#rail a:focus-visible,#main a:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 2px #0B0D10}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid #5C6670;font:500 11px var(--f-mono);color:#A9B3BE;white-space:nowrap}
.badge b{color:#ECEFF2}
.lbl-s{font:500 11px var(--f-mono);color:#8592A0;text-transform:uppercase;letter-spacing:.04em}
.fwrap{margin:0 0 28px}
.fcap{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;font:500 12px var(--f-mono);color:#A9B3BE}
.fcap b{color:#ECEFF2}
.fscale{position:relative;transform-origin:top left}
.fframe{transform-origin:top left;position:absolute;left:0;top:0;outline:1px solid #5C6670}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:block;padding:12px;background:#14181D;border:1px solid #2A313A;color:#ECEFF2;text-decoration:none}
.card:hover{border-color:#8592A0}.card .code{color:#8592A0}
.swatch{display:flex;flex-direction:column;border:1px solid #5C6670;min-height:84px}
.swatch i{flex:1;min-height:44px}.swatch span{padding:4px 6px;font:500 11px/1.3 var(--f-mono);background:#14181D;color:#ECEFF2}
.dsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.matrix{border-collapse:collapse;width:100%}.matrix td,.matrix th{border:1px solid #2A313A;padding:8px;vertical-align:top;font-size:12px}
.matrix th{font:500 11px var(--f-mono);color:#8592A0;text-transform:uppercase}
.mcell{min-width:150px}
.ann-ov{position:absolute;inset:0;z-index:50;pointer-events:none}
.ann-box{position:absolute;border:1px solid #FF3DF5;background:rgba(255,61,245,.07)}
.ann-n{position:absolute;left:-1px;top:-16px;min-width:16px;height:16px;padding:0 3px;background:#FF3DF5;color:#000;font:700 11px/16px var(--f-mono);text-align:center}
.ann-list{font:12px/1.5 var(--f-mono);color:#ECEFF2;display:grid;gap:4px;margin-top:8px}
.ann-list div{padding:4px 8px;border-left:3px solid #FF3DF5;background:#14181D}
[data-gray="1"] .frame,[data-gray="1"] .fscale{filter:grayscale(1)}
[data-ph="1"] .ph{outline:2px dashed #FF3DF5;outline-offset:1px;background:rgba(255,61,245,.18)}
.flowstep{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 10px;border:1px solid #2A313A;background:#14181D;cursor:pointer;color:#ECEFF2;text-align:left;width:100%}
.flowstep[aria-current="step"]{border-color:#ECEFF2;background:#1C2128}
.flowstep .n{font:700 12px var(--f-mono);color:#8592A0}.flowstep .cite{font:500 11px var(--f-mono);color:#8592A0}
.two{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){body.shell{grid-template-columns:1fr}#rail{display:none}.two{grid-template-columns:1fr}}

/* ============ EVA (SCR-12) — OPS mode; portrait follows 04 §E.5, landscape is a Proposed deviation (G-01) ============ */
.eva{display:flex;flex-direction:column;height:100%;background:var(--bg);color:var(--text-1)}
.eva .safety{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 12px 0;flex:none}
.eva.l .safety{height:112px}.eva.p .safety{height:132px}
.eva .big{display:flex;flex-direction:column;justify-content:flex-start;gap:2px;padding:6px 10px;min-width:0;--fill:var(--panel)}
.eva .big .lbl{font-size:12px;line-height:1.1}
.eva.l .big{padding:2px 10px;gap:0}.ic{width:16px;height:16px;flex:none}.nm .ic,.next .ic{width:20px;height:20px;vertical-align:-4px}
.eva .bigv{font-size:64px;line-height:1;white-space:nowrap}
.eva.p .bigv{font-size:56px}
.eva .bigv .unit{font:500 18px var(--f-mono);margin-left:6px}
.eva .bigv .chip{margin-left:6px}
.eva .bigsub{font:500 16px/1.2 var(--f-ui);color:var(--text-2);white-space:nowrap;display:flex;gap:6px;align-items:center}
.eva .nav{flex:1;min-height:0;display:grid;gap:8px;padding:6px 12px}
.eva.l .nav{grid-template-columns:1fr 1fr}.eva.p .nav{grid-template-rows:auto 1fr}
.eva .next{display:flex;flex-direction:column;gap:4px;padding:6px 10px;min-width:0;--fill:var(--panel)}
.eva .next .nm{font:600 16px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eva .nrow{display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}.eva .nrow>span{white-space:nowrap}
.eva .nrow .v{font-size:32px;line-height:1.1}.eva .nrow .unit{font:500 16px var(--f-mono)}
.eva .nrow .chip{margin-left:4px}
.eva .mini{position:relative;min-height:0;overflow:hidden;border:1px solid var(--edge)}
.eva .strip{height:24px;flex:none;display:flex;align-items:center;gap:0;padding:0 12px;background:var(--bg);border-top:1px solid var(--hairline);font:500 16px/24px var(--f-mono);color:var(--text-2);white-space:nowrap;overflow:hidden}
.eva .strip>span+span::before{content:"·";margin:0 8px;color:var(--text-3)}
.eva .acts{flex:none;display:grid;gap:8px;padding:8px 12px}
.eva.l .acts{grid-template-columns:repeat(4,1fr);height:72px}.eva.p .acts{grid-template-columns:1fr 1fr;height:136px}
.eva .acts .cutw{display:flex;width:100%}.eva .acts .btn{width:100%;min-height:56px;font-size:16px}
.eva .acts .holdnote{display:none}
.eva .pill{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--f-mono);letter-spacing:.04em}
.eva .linkbars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:-1px}
.eva .linkbars i{display:block;width:5px;background:var(--text-1)}.eva .linkbars i.off{background:transparent;border:1px solid var(--text-3)}
.eva .linkbars i:nth-child(1){height:6px}.eva .linkbars i:nth-child(2){height:10px}.eva .linkbars i:nth-child(3){height:14px}
.eva .dashedbox{border:1px dashed var(--text-2)}
.eva .sheetL{position:absolute;z-index:6;right:0;top:64px;bottom:0;width:60%;display:flex;flex-direction:column;background:var(--panel);border-left:2px solid var(--edge)}
.eva .sheetP{position:absolute;z-index:6;left:0;right:0;bottom:0;height:70%;display:flex;flex-direction:column;background:var(--panel);border-top:2px solid var(--edge)}
.eva .sheet-b{flex:1;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.eva .sheet-f{flex:none;padding:8px 12px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--hairline)}
.eva .sheet-f .cutw{display:flex}.eva .sheet-f .btn{width:100%;min-height:56px;font-size:16px}
.opt{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:6px 10px;--fill:var(--raised);cursor:pointer;text-align:left;width:100%;color:var(--text-1);border:0;background:transparent;font:inherit}
.opt.sel{--line:var(--route)}
.opt .rk{font:700 24px var(--f-mono)}
.opt .okind{font:600 16px/1.2 var(--f-ui)}
.opt .oeta{font-size:28px;line-height:1}.opt .oeta .unit{font-size:14px}
.opt .odet{font:12px/1.3 var(--f-ui);color:var(--text-2);display:flex;gap:10px;flex-wrap:wrap}
.opt.dis{opacity:.7;cursor:not-allowed}
.eva.l .opt{padding:2px 10px;gap:6px;min-height:44px}.eva.l .opt .okind{font-size:15px}.eva.l .opt .rk{font-size:20px}.eva.l .opt .oeta{font-size:24px}.eva.l .opt .odet{font-size:11px;gap:8px}.eva.l .sheet-b{gap:6px}
.eva .spacer{flex:1}

/* ============ HUD (SCR-13) ============ */
.hud{position:relative;display:flex;flex-direction:column;height:100%;background:#000;color:#fff;user-select:none;touch-action:none}
.hud .hline{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 48px}
.hud .halert{font:700 24px/1.2 var(--f-ui);color:var(--text-1);display:flex;align-items:center;gap:12px;width:100%;height:100%;padding:0 12px;border:3px solid var(--warning)}
.hud .halert[data-level="caution"]{border-color:var(--caution);color:var(--caution)}
.hud .halert[data-level="warning"]{color:var(--warning)}
.hud .halert[data-level="advisory"]{border-color:var(--advisory);color:var(--advisory)}
.hud .halert .sicon{width:32px;height:32px;--halo:#000}
.hud .hgrid{flex:1;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:16px;padding:18px 48px 8px;align-items:start}
.hud .hc{display:flex;flex-direction:column;gap:6px}
.hud .hv{font-size:72px;line-height:1;white-space:nowrap}
.hud .hv.m{font-size:56px}.hud .hv .unit{font:500 22px var(--f-mono);margin-left:6px}
.hud .hl{font:500 16px/1.2 var(--f-mono);color:var(--text-2);text-transform:uppercase;letter-spacing:.06em}
.hud .hs{font:500 20px/1.2 var(--f-ui);color:var(--text-2);display:flex;gap:8px;align-items:center}
.hud .hfoot{height:56px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:0 64px;font:500 18px var(--f-mono);color:var(--text-2)}
.hud .hx{position:absolute;left:0;bottom:0;height:6px;background:#fff;width:0;z-index:5}
.hud .stale .num{color:var(--text-2)}
.hud .dash{border:2px dashed var(--text-2)}

/* ============ OPS CONSOLE (SCR-11) ============ */
.ops{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.ops .top{height:48px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--edge)}
.ops .top .ttl{font-size:16px;white-space:nowrap}
.ops .top .sp{flex:1}
.ops .phase{height:32px;flex:none;display:flex;align-items:stretch;gap:0;padding:0 12px;border-bottom:1px solid var(--hairline);background:var(--bg)}
.ops .ph-i{display:flex;align-items:center;gap:4px;padding:0 10px;font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--text-3);margin:5px 0 5px -1px;white-space:nowrap;position:relative}
.ops .ph-i.past{background:var(--text-3);color:var(--bg)}
.ops .ph-i.now{background:var(--text-1);color:var(--bg);font-weight:700;border-color:var(--text-1)}
.ops .ph-i.now::after{content:"▼";position:absolute;left:50%;bottom:-1px;transform:translate(-50%,0);font-size:8px;color:var(--text-1)}
.ops.unl .ph-i{border-style:dashed}
.ops .main{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr 320px;gap:8px;padding:8px}
.ops.w1280 .main{grid-template-columns:272px 1fr 296px}
.ops.w1024 .main{grid-template-columns:1fr}
.ops .colL,.ops .colR{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.ops .colM{display:flex;flex-direction:column;min-height:0;position:relative}
.ops .log{height:128px;flex:none;margin:0 8px 8px;overflow:auto}
.ops .logrow{display:grid;grid-template-columns:52px 76px 1fr auto;gap:8px;align-items:center;padding:3px 12px;border-bottom:1px solid var(--hairline);font:13px/1.3 var(--f-ui);background:none;border-left:0;border-right:0;border-top:0;color:var(--text-1);text-align:left;width:100%;cursor:pointer}
.ops .logrow .t{font:500 12px var(--f-mono);color:var(--text-2)}
.crewc{padding:0;min-width:0}
.crewc .pb{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:4px 12px 10px}
.crewc.stale{opacity:1}.crewc.stale .cut{--line:var(--text-2)}
.crewc .act{font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.mini-v{font-size:22px;line-height:1.15}
.mini-v .unit{font-size:12px}
.qr{width:96px;height:96px;background:#fff;color:#000;display:block}
.chart{display:block;width:100%}
.opscard{padding:0}
.big-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;flex:1;position:relative}
.ops .notice1024{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:40px;text-align:center}

/* ============ BRIEF / PRINT / PLANNER ============ */
.brief{background:var(--bg);color:var(--text-1);min-height:100%}
.brief .slab{background:var(--slab);color:var(--on-slab)}
.brief .sig{background:var(--signal);color:var(--on-signal)}
.stat{display:flex;flex-direction:column;justify-content:space-between;padding:18px 20px;min-height:150px}
.stat .sv{font:500 56px/1 var(--f-mono)}
.print{background:#fff;color:var(--text-1)}
.print .pg{width:794px;height:1123px;padding:45px;display:flex;flex-direction:column;gap:12px;position:relative;font-size:12px}
.planner{display:flex;flex-direction:column;height:100%;background:var(--bg);color:var(--text-1)}
.planner .pmain{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr 320px}
.planner .drawer{display:flex;flex-direction:column;min-height:0;overflow:auto;border-right:1px solid var(--edge);background:var(--panel)}
.planner .drawer.r{border-right:0;border-left:1px solid var(--edge)}
.planner .res{height:220px;flex:none;display:grid;grid-template-columns:280px 1fr 300px;border-top:1px solid var(--edge);background:var(--panel)}
.planner.w1024 .pmain{grid-template-columns:1fr}
.tabs{display:flex;border-bottom:1px solid var(--edge)}
.tabs button{flex:1;min-height:36px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--text-2);font:600 13px var(--f-ui)}
.tabs button[aria-selected="true"]{color:var(--text-1);border-bottom-color:var(--text-1)}
.pbar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--edge)}

/* EVA high-contrast (HUD palette) alert bars: outlined, because white on warning-fill is 6.54:1 (< 7:1) */
[data-hc="1"] .alertbar[data-level="warning"]{background:#000;color:var(--warning);box-shadow:inset 0 0 0 4px var(--warning)}
[data-hc="1"] .alertbar[data-level="caution"]{background:#000;color:var(--caution);box-shadow:inset 0 0 0 4px var(--caution)}
[data-hc="1"] .alertbar[data-level="caution"]::after{display:none}
[data-hc="1"] .btn.crit-w{--fill:#000;--line:var(--warning);color:var(--warning)}
[data-hc="1"] .btn.crit-c{--fill:#000;--line:var(--caution);color:var(--caution)}
.eva.p .strip{padding:0 8px}.eva.p .strip>span+span::before{margin:0 5px}.eva .strip .chip{padding:0 2px;height:16px}

@media print{
  body.printing *{visibility:hidden!important}
  body.printing .print-target,body.printing .print-target *{visibility:visible!important}
  body.printing .print-target{position:absolute;left:0;top:0;width:794px}
  body.printing .fframe{transform:none!important;position:static!important;outline:0!important}
  .noprint,.fcap,.ann-list{display:none!important}
}
.stage .cell{min-width:0;overflow:auto;max-width:100%}

.eva.p .alertbar{gap:8px;padding:0 10px}.eva.p .alertbar .atext{font-size:20px;line-height:1.1}.eva.p .alertbar .sicon{width:24px;height:24px}
.notice1024{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;padding:40px;text-align:center;background:var(--bg);color:var(--text-1)}
.planner.w1024 .res{grid-template-columns:220px 1fr 240px}.planner.w1024 .pbar .micro,.planner.w1024 .pbar .chip{display:none}
.planner.w1024 .res .metrics6{grid-template-columns:repeat(3,1fr)!important}
.planner.w1024 .res{height:252px}

/* ---- EVA landscape v2: two compact cards top-left, NEXT below, map = whole right column ---- */
.eva.l .body{flex:1;min-height:0;display:grid;grid-template-columns:46% 1fr;gap:8px;padding:6px 12px}
.eva.l .leftcol{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.eva.l .leftcol .safety{padding:0;height:100px;flex:none;gap:8px}
.eva.l .leftcol .next{flex:1;min-height:0;overflow:hidden}
.eva.l .mapcol{min-height:0;min-width:0}.eva.l .mapcol .mini{height:100%}
.eva.l .bigv{font-size:56px}.eva.l.t .bigv{font-size:64px}
.eva.l .bigv .unit{font-size:16px;margin-left:4px}
.eva.l.t .leftcol .safety{height:120px}
.eva.l.t .leftcol .next{padding:10px 14px;gap:8px}.eva.l.t .leftcol .next .nm{font-size:22px}
.eva.l.t .nrow{flex-direction:column;flex-wrap:nowrap;gap:6px}.eva.l.t .nrow .v{font-size:48px;line-height:1.05}
.eva.l .leftcol .nrow{flex-wrap:nowrap;gap:0 8px;white-space:nowrap}
.eva.l .leftcol .nrow .unit{font-size:14px}.eva.l .leftcol .nrow .chip{margin-left:2px;padding:0 2px}
.eva.l .leftcol .next .nm{font-size:16px}.eva.l.t .leftcol .nrow{flex-wrap:wrap}
.eva .bigv .status{font-size:22px;gap:8px}.eva .bigv .status .sicon{width:30px;height:30px}
.hud .hv .status{font-size:34px;gap:10px}.hud .hv .status .sicon{width:44px;height:44px}

/* EVA status line in the alert slot (DV-03) */
.alertslot .statusline{position:absolute;inset:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);color:var(--text-2);font:500 16px/1 var(--f-ui);letter-spacing:0;text-transform:none}
.alertslot .statusline .sicon{width:28px;height:28px}
.statusline .sl-k{font:500 12px/1 var(--f-mono);color:var(--text-3);letter-spacing:.06em}
.statusline .sl-w{font:700 22px/1 var(--f-ui);color:var(--text-1);letter-spacing:.02em}
.statusline .sl-p{font:500 18px/1 var(--f-mono);color:var(--text-2);letter-spacing:.04em}
.statusline .sl-d{color:var(--text-2)}
.eva.p .statusline .sl-d,.eva.p .statusline .sl-k{display:none}

/* ============ FR-50 STOP TASKS (neutral chrome only: task progress is not a safety status, so no status colour) ============ */
.eva .nhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.eva .ncol{display:flex;flex-direction:column;gap:2px;min-width:0}
.eva.l:not(.t) .leftcol .nhead{min-height:56px}
.btn.tbtn{min-height:56px;padding:0 12px;gap:8px;font:600 16px/1 var(--f-ui);white-space:nowrap}
.btn.tbtn .num{font-size:20px}.btn.tbtn .val .unit{display:none}
.tpill{display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:0 12px;--fill:var(--raised);font:600 16px var(--f-ui);color:var(--text-2);white-space:nowrap}
.tpill .num{font-size:20px;color:var(--text-1)}
.tasks{display:flex;flex-direction:column;min-height:0;padding:4px 6px 6px;--fill:var(--panel);overflow:hidden}

.thead{display:flex;align-items:center;gap:8px;min-height:24px;flex:none}
.tcnt{font-size:18px}
.tlist{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}
.trow{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;min-height:56px;flex:none;background:var(--raised);border:1px solid var(--hairline);padding-right:6px}
.tbox{width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--text-1);padding:0;cursor:pointer}
.tbox:disabled{color:var(--text-2);cursor:default}
.trow.skipped .tbox,.trow.dropped .tbox{color:var(--text-3)}
.trow.skipped .ttxt,.trow.dropped .ttxt{color:var(--text-3)}
.tcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttxt{font:600 16px/1.15 var(--f-ui);color:var(--text-1)}

.btn.tskip{min-height:56px;min-width:64px;padding:0 10px;font:600 14px var(--f-ui)}

.tundo .uw{font:600 15px var(--f-ui);white-space:nowrap}
.ubar{flex:1;height:6px;background:var(--hairline);position:relative;min-width:24px}
.ubar i{position:absolute;left:0;top:0;bottom:0;background:var(--text-1);width:100%;animation:ubar 5s linear forwards}
.ubar.pin i{animation:none}
@keyframes ubar{from{width:100%}to{width:0}}
.tmore{display:none;font:500 11px var(--f-mono);color:var(--text-3);text-align:center;flex:none}.tasks[data-more="1"] .tmore{display:block}
.eva.t .trow{min-height:64px}.eva.t .tbox{height:64px}

.mapexp{position:absolute;top:6px;right:6px;z-index:4;display:flex}

.eva .layersheet{position:absolute;right:8px;bottom:80px;z-index:6;padding:8px;--fill:var(--panel);display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 16px)}
.layersheet .lrow{display:flex;gap:8px;flex-wrap:wrap}
.mlegend{font:500 12px/1.3 var(--f-mono);color:var(--text-2);max-width:420px}
.eva.l .body.full{position:relative}
.eva.l .body.full .mapcol{position:absolute;left:12px;right:12px;top:6px;bottom:6px;z-index:1}

.eva .nav.full{grid-template-columns:1fr;grid-template-rows:1fr}
.eva.p .nav.full .mini{grid-column:1}
.mapzoom{display:flex;flex-direction:column;gap:6px}

 bar replaces the line in the same slot, so nothing shifts."],["G-03","02 §E.6 EVENT; 05 Warning.severity vs 04 §C.1","`severity:\"blocked\"` and `caution|blocked|unknown` versus the rename `blocked → warning`; 05 Alert.level uses warning/caution/advisory.","Runtime alerts use 05 `level`; planner warnings keep 05's enum and render as the ⬣ warning icon."],["G-04","05 §F.6 vs 04 §D.2","Log example \"Radiation surge — shelter now\" vs the action — reason grammar.","04 wins: \"Shelter now — radiation surge\". 05 §F.6 should be corrected."],["G-05","04 §E.4/E.5 vs 05 Crew, 02 §C.5 L9","Dose shown in mGy; the schema stores µGy and forbids Sv conversion.","Literal example strings in the prototype; the unit formatter is a TASK-24 item."],["G-06","04 §E.4 vs §E.5","EV1 dose 0.0 mGy vs 0.1 mGy at apparently the same moment.","0.0 before the alert, 0.1 from the alert; both cited."],["G-07","04 §D.3 vs 01 §E.1","Confirmation copy says \"ETA 12 min\"; the rendezvous option is 14 min.","14 min used."],["G-08","04 §D.2 vs 03 §C.6 step 7","\"Comm shadow in 120 m — stay with EV2\" vs \"Comm shadow ahead — …\".","First is the caution-bar text; second is the journey label."],["G-09","03 §B, 04 §B.2","No mode named for SCR-00 or SCR-18.","SCR-00 = OPS (**Proposed**); SCR-18 inherits the host mode."],["G-10","03 §B SCR-05","States row omits Over limits although the content and 03 §E.4 include it.","Added."],["G-11","04 §E.10 vs team codes","\"Number is the POI's order in pois.geojson\" vs codes SCI 01 / RES 02 / ENG 01 that look per-type.","The three codes used as given. Unresolved U-34."],["G-12","01 §E.1 + 04 §E.5","Only stop 2 (resource) and stop 3 (Boxwork ridge) are fixed.","Stop 1 = EZ—ENG 01 with a placeholder name (**Proposed**)."],["G-13","02 §E.2 / §E.6 vs 05 §F.1–F.3","Illustrative coordinates disagree (boxwork at 2410/−1875 vs 410/325; hab −1800/−1500).","Map is schematic; metre coordinates only for the 02 §E.2 sample and the 05 §F.1 hab."],["G-14","02 §E.6 vs 04","Snapshot NDED (advisory icon), with a detail text and the current EVA phase on the right (portrait: word and phase only). The alert bar replaces it in the same slot when an alert is raised and the line returns when the alert is acknowledged and cleared. It is not a live region, so it never announces itself. Ops and HUD keep the slot empty."],["Same words everywhere","04 §D.2","One alert store drives ops, EVA and HUD; the Stage page reads the text from each frame and shows IDENTICAL or DIFFER."],["Staleness and link loss","04 §D.5","Values older than 5 s turn text-3 with an age stamp. Unlinked: EVA shows the caution bar \"No hab link — operating on cached plan\"; ops shows the crew card dashed with last-known values and age; commands show \"Queued — sends when link returns\" and are resent on reconnection."],["HUD exit","03 SCR-13","Tap and hold anywhere for 2 s; a thin progress line appears at the bottom edge; release cancels."],["EVA high contrast","04 §F Glare","Switches the EVA frame to the HUD palette; alert bars become outlined (DV-05)."],["Ops mute","04 §C.7","Toggle with a visible SOUND OFF / SOUND ON indicator; warning two-tone repeats every 5 s until acknowledged; vibration pattern 3 × 200 ms where the Vibration API exists."],["Ops keys","04 §F","Space pause · 1/2/3 speed · N next event · K acknowledge · O focus options."],["Planner","04 §F, App. A","A add-stop mode · Enter place at crosshair · Delete remove selected · B briefing · ? sources · arrows pan · +/− zoom. Drag stops; on drop validate → snap offer (≤ 50 m) or refuse; max two scientific overlays (a third dims the oldest and says so); inputs recompute after a 300 ms debounce and an invalid value is never sent."],["Demo player","01 §E.1, §E.2, 10","Beats hold between keyframes; markers tween visually only; 60× plays at the pace of the recorded table, 10× and 1× are slower; next event, previous, scrub. Commands from the Stage (hold Summon) advance the replay."],["Stop tasks (FR-50)","FR-50; 04 §E.5 addition","Rows are at least 56 px with a neutral check box, the task text and SKIP. One tap marks DONE or SKIPPED (no hold-to-confirm: not a safety action) and opens a 5-s undo strip with a shrinking bar (no number); the REASON control cycles time → terrain → alert → other. Without a hab link the change is queued and marked NOT SYNCED in the row and the strip, and clears when the link returns. Ops can add a task (ops-added rows list first, tagged ADDED BY OPS). Open tasks become DROPPED when a plan revision cuts the stop. During an alert the list collapses to a non-interactive count. Counts are looked up, never computed."],["Full-screen map and map controls","G-42, G-43","Tap the mini-map or press FULL. In landscape HAVEN and O₂ stack at the left as smaller cards and the map takes at least 80 % of the width; in portrait the cards stay in their row. The alert slot, strip and action row do not move. Buttons: +, −, FIT, FOLLOW, LAYERS, CLOSE. Extras: drag to pan, wheel or pinch to zoom. Layers: slope, thermal inertia, comm shadow, haven bands (at most two scientific overlays; a third turns the oldest off and says so). A warning closes the full map. The planner has + / − buttons, drag and wheel; ops has + / − / FIT, drag, wheel, and Slope and Thermal inertia toggles."]],"a11y":["Contrast: BRIEF/OPS text ≥ 4.5 : 1, non-text ≥ 3 : 1, HUD ≥ 7 : 1; the Design system page computes every pair live and compares it with the 04 §C.1 value.","The EVA status line is a status like any other: nominal icon (circle with check), the word NOMINAL, and the fixed alert slot; it is not an aria-live region so nothing is announced while it is idle.","Four cues per status: colour + shape + word + fixed slot. The Grayscale toggle applies a grayscale filter and the badge counts statuses that have all four cues.","Focus: white 2 px ring with a 2 px void gap on every control; chamfered controls draw the ring on a wrapper because clip-path clips outlines.","Targets: EVA ≥ 56 px with ≥ 8 px gaps (measured in Chromium for all 32 EVA state × device combinations); ops mouse ≥ 32 px.","Live regions: warnings role=alert + aria-live=assertive; cautions and advisories role=status + polite; crew cards and options are lists with full text.","No hamburger menus, no hover-only actions, no gesture-only paths in OPS/EVA; hidden content shows a count (alert \"+N\", log \"n / m\").","Reduced motion: no flashes (static bar) and no marker interpolation; animations and transitions are disabled.","Never colour alone for focus, selection or current step (P10): ring + outline + marker + label.","Task rows are at least 56 px; each check box is a button with a label such as \"Mark done: Observe the sulfate ledge face\"; the undo strip is a status region; task state never uses a status colour, so it reads in grayscale (shape + word).","Map: buttons are the primary path and every control has a word (icon + word on EVA); drag, wheel and pinch are extras; the planner keeps its keyboard keys (arrows pan, +/− zoom). The Add task button carries aria-disabled and it is kept in step with the field."],"fixture_map":[["meta","—","Prototype banner, disclaimer (01 §F.1), CRS string, data version"],["nums","02 §E.6 `provenance` map; 05 Crew / Vehicle / PlanResult fields","Every displayed number as {v, unit, prov, src}; src is a spec section or PLACEHOLDER"],["site","05 §C.1 Site, Layer, RoutingGrid, EnvConstant","Subset: layers with legends, default start, hab mast, env constants"],["pois","05 §C.1 POI (+ v2 stop_type, ez_theme, evidence)","Three EZ POIs with catalogue codes"],["param_sets","05 §C.1 ParamSet","Suit, PR1, UR1, link, alert, shielding"],["scenario","05 §C.2 Scenario, ScenarioEvent; 02 §E.7","storm-sol4190 with events e1 (DONKI) and e2 (Earth message)"],["dose_series","05 §C.2 DoseSeries","Shape placeholder until U-15; integral check expected 8,100 µGy"],["earth_link","05 §C.2 EarthLinkTable","Rows and passes PLACEHOLDER until U-18"],["options","05 §C.2 ContingencyOption","Rendezvous, abort, continue-skip"],["alerts","05 §C.2 Alert (code, level, message)","Copy for each alert code; sources cited"],["log","05 §C.2 LogEvent","Eight events with seq, kind, actor, provenance"],["snapshot_example","02 §E.6 SNAPSHOT","Same shape; numbers wrapped for the audit"],["sources","05 §C.1 DataSource","Ten dataset records with DS codes"],["tasks","05 StopTask (FR-50, Proposed); 02 UPDATE_STOP_TASK / ADD_STOP_TASK; log events TASK_ADDED, TASK_UPDATED, TASK_DROPPED","14 plan tasks (per crew and stop), one ops-added example, declared scenarios per screen state, count objects `n`, and the build-time lookup tables `counts`, `done_total`, `total_all`; text is PROPOSED copy"]],"usability":[["UT-1","3-s glance: from the HUD read haven, O₂ and next stop (Warning state).","≥ 2 of 3 users read all three within 3 s","04 §F.1; 01 §B.2"],["UT-2","Summon rover with gloves, no instruction, on the EVA tablet in **landscape**.","≥ 2 of 3 users, < 15 s","04 §F.1"],["UT-3","Ops: identify who is in danger and approve an option.","≥ 2 of 3 users, < 20 s","04 §F.1"],["UT-4","Grayscale screenshots of warning, caution, advisory, nominal, unknown: name each level.","100 % of alert levels","04 §F.1"],["UT-5","**Added:** glove test, landscape vs portrait. Each tester summons the rover and aborts on the same phone in both orientations (order alternated), gloves on, in the Alerting state.","Record time and mis-taps per orientation; target: landscape no worse than portrait by more than 2 s and ≤ 1 mis-tap per run. Result decides U-30.","New"],["UT-6","**Added:** rotate the phone mid-alert; point to haven and O₂ before and after rotating.","Both found again without searching (≥ 2 of 3): HAVEN is top-left in both, O₂ is the card right of it","New (G-24)"],["UT-7","**Added:** Nominal state on the EVA tablet with and without the status line in the alert slot: read haven, O₂ and next stop, then say what the top line means.","Reading time no worse than without the line by more than 0.5 s; ≥ 2 of 3 testers </script>
<script>
/* ---- a_core ---- */
'use strict';
/* ===== CORE: fixture access, escaping, glyph/icon library, provenance chips, status icons, N() ===== */
const FX = JSON.parse(document.getElementById('fixture').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const THIN = '\u2009';

/* ---- provenance (04 §C.1 chips; 01 provenance classes) ---- */
const PROV = {
  measured: { g: '<rect x="1.5" y="1.5" width="7" height="7" fill="currentColor"/>', label: 'MEASURED', ch: '■' },
  derived: { g: '<path d="M5 .6 9.4 5 5 9.4.6 5Z" fill="currentColor"/>', label: 'DERIVED', ch: '◆' },
  modelled: { g: '<circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/>', label: 'MODELLED', ch: '○' },
  assumed: { g: '<path d="M5 1.2 9.2 8.8H.8Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="miter"/>', label: 'ASSUMED', ch: '△' },
  replayed: { g: '<path d="M2 1 9 5 2 9Z" fill="currentColor"/>', label: 'REPLAYED', ch: '▶' },
  simulated: { g: '<path d="M5 .8 9.2 5 5 9.2.8 5Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.3"/>', label: 'SIMULATED', ch: '◇' },
};
function chip(prov, mode, src) {
  const p = PROV[prov]; if (!p) return `<span class="chip" data-prov="?">?</span>`;
  const t = esc(`${p.label}${src ? ' — ' + src : ''}`);
  return `<span class="chip ${mode === 'g' ? 'g' : ''}" data-prov="${prov}" title="${t}" ${src ? `data-src="${esc(src)}"` : ''}><svg viewBox="0 0 10 10" aria-hidden="true">${p.g}</svg>${mode === 'g' ? `<span class="sr">${p.label}</span>` : p.label}</span>`;
}

/* ---- numbers: every displayed value is a fixture num {v, unit, prov, src} (FR-15) ---- */
function numOf(key) { const n = FX.nums[key]; if (!n) { console.error('missing num', key); } return n; }
function fmtV(n) {
  if (n.v === null || n.v === undefined) return n.fmt || '##.#';
  if (typeof n.v === 'string') return n.v;
  let s = n.disp !== undefined ? String(n.disp) : String(n.v);
  if (n.v < 0) s = '\u2212' + s.replace('-', '');
  const m = s.match(/^(\u2212?)(\d+)(.*)$/);
  if (m && m[2].length > 3 && !['sol', 'seq', 'seed', 'rev'].includes(n.unit)) s = m[1] + m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + m[3];
  return s;
}
const NOSPACE_UNITS = new Set(['°', '°E', '×', '%']);
function N(key, o = {}) {
  const n = typeof key === 'string' ? numOf(key) : key;
  if (!n) return `<span class="val ph" data-provenance="unknown">⚠ ${esc(key)}</span>`;
  const isPh = n.v === null || n.v === undefined;
  const cls = ['val', isPh ? 'ph' : '', (o.stale || o.grey) ? 'stale' : '', o.loading ? 'loading' : '', o.cls || ''].filter(Boolean).join(' ');
  const style = o.size ? ` style="font-size:${o.size}px"` : '';
  const showUnit = o.unit !== false && n.unit && !['hash', 'sha256', 'fraction', 'seq', 'seed', 'rev', 'sol', 'LTST', 'h:mm', 'm:ss', 'mm:ss', 'HH:MM', 'bars', 'msg', 'MY', 'stops', 'missions', 'types', 'LOS 0/1', 'factor'].includes(n.unit) || o.unit === true;
  const unitTxt = o.unitText || n.unit;
  const unit = showUnit && !(n.v === null && o.hideUnitPh) ? `<span class="unit">${NOSPACE_UNITS.has(unitTxt) ? '' : THIN}${esc(unitTxt)}</span>` : '';
  const chipHtml = o.chip === false ? '' : chip(n.prov, o.chip === 'g' ? 'g' : (o.chip || 'g'), n.src);
  const age = o.stale ? `<span class="age">${esc(o.stale === true ? '0:42' : o.stale)}</span>` : '';
  const title = isPh ? `PLACEHOLDER — unblocked by ${n.unblocks || 'TBD'}` : `${n.prov} — ${n.src}`;
  return `<span class="${cls}"${style} data-provenance="${n.prov}" data-num="${typeof key === 'string' ? key : ''}" data-src="${esc(n.src)}"${isPh ? ' data-placeholder="1"' : ''} title="${esc(title)}"><span class="num">${esc(o.prefix || '')}${esc(fmtV(n))}</span>${unit}${age}${chipHtml}</span>`;
}
/* Number-free textual value that still needs a provenance class (strings like versions) */
function T(text, prov, src, o = {}) {
  return `<span class="val ${o.cls || ''}" data-provenance="${prov}" data-src="${esc(src || '')}"><span class="num">${esc(text)}</span>${o.chip === false ? '' : chip(prov, 'g', src)}</span>`;
}
/* Placeholder text (non-numeric): dotted underline, same audit rules */
function PH(text, unblocks, prov = 'assumed') {
  return `<span class="val ph" data-provenance="${prov}" data-placeholder="1" title="PLACEHOLDER — unblocked by ${esc(unblocks)}"><span class="num">${esc(text)}</span></span>`;
}

/* ---- status icon: shape + pattern + glyph (04 §C.1, §G <status-icon level>) ---- */
const LEVELS = {
  nominal: { word: 'NOMINAL', shape: 'circle', pat: 'solid' },

  warning: { word: 'WARNING', shape: 'oct', pat: 'cross' },

  unknown: { word: 'UNKNOWN', shape: 'dia', pat: 'dots' },

  circle: '<circle cx="10" cy="10" r="8.2"/>',
  tri: '<path d="M10 2 18.6 17.6H1.4Z"/>',
  oct: '<path d="M6.2 1.6h7.6l4.6 4.6v7.6l-4.6 4.6H6.2l-4.6-4.6V6.2Z"/>',
  dia: '<path d="M10 1.4 18.6 10 10 18.6 1.4 10Z"/>',

const HATCH = {
  solid: '', diag: '<g stroke="currentColor" stroke-width="1.2" stroke-opacity=".55"><path d="M0 8 8 0M0 14 14 0M0 20 20 0M6 20 20 6M12 20 20 12"/></g>',
  cross: '<g stroke="currentColor" stroke-width="1.1" stroke-opacity=".6"><path d="M0 8 8 0M0 14 14 0M0 20 20 0M6 20 20 6M12 20 20 12M12 0 0 12M20 0 0 20M20 6 6 20M20 12 12 20M8 0 0 8"/></g>',
  dots: '<g fill="currentColor" fill-opacity=".7"><circle cx="6" cy="6" r=".9"/><circle cx="10" cy="4" r=".9"/><circle cx="14" cy="6" r=".9"/><circle cx="4" cy="10" r=".9"/><circle cx="16" cy="10" r=".9"/><circle cx="6" cy="14" r=".9"/><circle cx="14" cy="14" r=".9"/><circle cx="10" cy="16" r=".9"/></g>',
};
const SYM = {
  nominal: '<path d="M5.6 10.4 8.7 13.4 14.6 7" />',
  caution: '<path d="M10 7.6v4.4M10 14.1v.1" />', warning: '<path d="M10 5.6v5.6M10 13.8v.1" />',
  advisory: '<path d="M10 9v5M10 6.2v.1" />', unknown: '<path d="M8 7.9c0-1.2.9-2 2.1-2s2 .8 2 1.8c0 1.8-2.1 1.7-2.1 3.5M10 14.2v.1" />',
};
function sicon(level, cls = '') {
  const L = LEVELS[level] || LEVELS.unknown;
  const fillSolid = L.pat === 'solid';
  return `<svg class="sicon ${cls}" viewBox="0 0 20 20" aria-hidden="true">
    <g class="sh-wrap"><g class="pt" ${fillSolid ? 'style="fill-opacity:1"' : 'style="fill-opacity:.0"'}>${SHAPES[L.shape].replace('<', '<')}</g>
    <g class="sh">${SHAPES[L.shape]}</g></g>
    ${fillSolid ? '' : `<g clip-path="url(#cp-${L.shape})">${HATCH[L.pat]}</g>`}
    <g class="sy" style="stroke:var(--halo,var(--bg));stroke-width:4;paint-order:stroke">${SYM[level] || SYM.unknown}</g>
    <g class="sy" style="stroke:${fillSolid ? 'var(--halo,var(--bg))' : 'currentColor'}">${SYM[level] || SYM.unknown}</g></svg>`;
}
/* status = colour + shape + word + fixed position (slot is the screen region name) */
function status(level, o = {}) {
  const L = LEVELS[level] || LEVELS.unknown;
  return `<span class="status" data-status="${level}" data-slot="${esc(o.slot || 'inline')}">${sicon(level)}<span class="sword">${esc(o.word || L.word)}</span>${o.extra ? `<span class="t3" style="font-weight:500;letter-spacing:0;text-transform:none;font-family:var(--f-ui)">${esc(o.extra)}</span>` : ''}</span>`;
}

/* ---- UI icons: own 24px set, 1.5px stroke, square caps (Lucide is the product set — licence U-27) ---- */
const ICONS = {
  play: '<path d="M7 5v14l11-7Z"/>', pause: '<path d="M8 5v14M16 5v14"/>', next: '<path d="M6 5v14l9-7ZM18 5v14"/>',
  vol: '<path d="M4 9v6h4l5 4V5L8 9ZM16 9.5c1.3 1.3 1.3 3.7 0 5M18.5 7c2.6 2.6 2.6 7.4 0 10"/>', mute: '<path d="M4 9v6h4l5 4V5L8 9ZM17 9l5 6M22 9l-5 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', check: '<path d="M5 12.5 10 17.5 19 7"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>', right: '<path d="M5 12h14M13 6l6 6-6 6"/>', left: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  layers: '<path d="M12 3 2.5 8 12 13l9.5-5ZM2.5 12.5 12 17.5l9.5-5M2.5 16.5 12 21.5l9.5-5"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>',
  print: '<path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7Z"/>', dl: '<path d="M12 3v12M6 10l6 6 6-6M4 20h16"/>', ul: '<path d="M12 16V4M6 9l6-6 6 6M4 20h16"/>',
  pin: '<path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12ZM12 6.5v5M9.5 9h5"/>', undo: '<path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-3" transform="translate(0 -3)"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/>', rot: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/>',

  const content = par('datasets', 'Datasets', ['Every layer and computed value carries a provenance class and a link here. Credit goes to NASA, USGS and ESA. <b>ESA Mars Express HRSC</b> is inside the USGS Gale merged DEM; <b>ESA TGO</b> trajectory kernels give the relay geometry; Solar Orbiter (ESA/NASA) is the source of the flare-class estimate for 20 May 2024.']).replace('</section>', FX.sources.map(sp).join('') + '</section>') +
    par('processing', 'Processing', ['The source DEM is equirectangular with standard parallel 0°. It is reprojected to a local equirectangular projection on the IAU_2015:49900 sphere (radius 3,396,190 m, east-positive longitude), because at about 4.75°S the source x-scale overstates east–west ground distance by 0.343 %. Mars coordinates never pass through EPSG:3857 or WGS84 code paths.', 'Slope is computed on the 1 m posts and aggregated to a 5 m routing grid (slope_p90, slope_max). Thermal inertia is sampled on its own 100 m grid. Hab-mast line of sight is a viewshed over the 5 m grid with curvature drop d²/2R.']) +
    par('models', 'Models', ['<b>Walking time</b> uses a Tobler-based speed scaled to 3.3 km/h on flat ground (assumed, Apollo 17 planning value). <b>Background radiation</b> is a measured rate multiplied by the planned duration, labelled simplified.', eq('dose_mSv = rate_mSv_per_day × duration_h / 24      (02 §D.4)'), '<b>Time to haven</b> is the minimum of walking to the hab and a rendezvous with the pressurized rover, plus 5 minutes ingress (assumed).', eq('haven(p) = min( T_hab(p) + t_ingress , min_q max(T_crew(q), T_veh(q)) + t_ingress )   (02 §D.8)'), '<b>Event dose</b> integrates the replayed surface rate with an assumed shielding factor per location (suit 1.0, pressurized rover 0.6, hab 0.4; physical shielding is not modelled).']) +
    sec('assumptions', 'Assumptions (ParamSets)', `<table class="tbl" style="font-size:13px"><tr><th>Set</th><th>Values</th><th>Provenance</th></tr>${ps}</table>`) +
    par('replay', 'Replay sources', ['The 20 May 2024 solar particle event is a real historical record <b>replayed</b> on a simulated mission clock; it is not a live feed from Mars. The RAD dose curve is “replayed — Curiosity RAD, 20 May 2024”; its time series is not yet archived for this build (U-15), so the chart shape is a placeholder.']) +
    par('limits', 'Limitations', ['Radio coverage is line-of-sight only: no Fresnel zone, diffraction or multipath. Sun elevation ignores terrain shadowing, refraction and dust. Low thermal inertia is read as “possible loose fines”, an assumed interpretation (A-05). Slope limits, speeds, consumables and shelter values are illustrative assumptions.']) +
    par('ai', 'AI use', [esc(FX.meta.ai_use) + ' Coding assistants used to build the system are disclosed in docs/AI_USE.md.']) +
    sec('diag', 'Diagnostics', `<div class="kv" style="grid-template-columns:140px 1fr"><span class="lbl">DATA VERSION</span><span class="mono">${esc(FX.site.data_version)}</span><span class="lbl">CHECKSUMS</span>${PH('not checked in the prototype', 'TASK-14')}<span class="lbl">FIXTURE</span><span class="mono">${esc(FX.meta.fixture_version)}</span></div>`);
  return `<div class="brief" style="height:100%;overflow:auto;padding:${small ? 14 : 28}px" data-ann="id:SCR-09|note:Long-form uses Source Serif 4 (P7); dataset entries are specimen cards with DS codes matching DataSource ids (P1, P3)"><div style="display:grid;grid-template-columns:${two ? '200px 1fr' : '1fr'};gap:28px"><nav aria-label="Index" style="${two ? 'position:sticky;top:0;align-self:start' : ''}"><span class="micro">INDEX</span><ul style="margin-top:6px;display:flex;flex-direction:${two ? 'column' : 'row'};gap:6px;flex-wrap:wrap">${toc.map((t, i) => `<li><a href="#${['datasets', 'processing', 'models', 'assumptions', 'replay', 'limits', 'ai', 'diag'][i]}" style="font-size:14px">${t}</a></li>`).join('')}</ul></nav><div style="min-width:0"><span class="code" style="color:var(--text-2)">[ SCR-09 /// SOURCES & METHODS ]</span><h1 class="disp" style="font-size:${small ? 32 : 52}px;margin:4px 0 20px;font-weight:500">Sources & methods</h1>${content}</div></div></div>`;
}

  const tile = ([k, n, d, t]) => `<div class="cut cut-m" style="--fill:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative"><span class="code">[ ${k.toUpperCase()} ]</span><b class="disp" style="font-size:24px">${n}</b>${t === 'T2' ? '<span class="tag t2s" style="align-self:flex-start">T2 SCOPE</span>' : ''}<span style="font-size:14px">${d}</span><div class="sp"></div>${s === 'taken' && k === 'eva:EV1' ? `<div class="errtxt">${sicon('caution')}<span>EV1 is connected on another device — take over?</span></div><div class="row" style="gap:6px">${btn('Take over', { size: 'sm', kind: 'primary', act: 'noop' })}${btn('Pick another role', { size: 'sm', act: 'noop' })}</div>` : btn('Join ▸', { size: 'sm', act: 'noop', disabled: s === 'connecting' || s === 'unreach', kind: 'primary' })}</div>`;

  return `<div class="brief" style="height:100%;overflow:auto;padding:${W < 480 ? 14 : 28}px" data-ann="id:SCR-10|note:Five role tiles; the ops console shows a QR per role; a device remembers its role for the session only"><span class="code" style="color:var(--text-2)">[ SCR-10 /// JOIN ]</span><h1 class="disp" style="font-size:${W < 480 ? 34 : 56}px;font-weight:500;margin:4px 0 14px">Join as</h1>
    <div class="row" style="gap:12px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--edge)"><span class="micro">[ HAB CORE ]</span>${stat}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(${W < 480 ? 240 : 210}px,1fr));gap:14px">${roles.map(tile).join('')}</div>${s === 'unreach' ? `<div class="cut cut-s" style="--fill:var(--panel);--line:var(--warning);padding:12px;margin-top:16px"><b>Connecting to hab… ${PH('http://##.##.##.##:####', 'TASK-28')}</b><div class="t2" style="font-size:13px">Check the router; retry; or use single-laptop mode.</div></div>` : ''}</div>`;
}

/* ---- print helpers ---- */
function printBar(fid) { return `<div class="noprint" style="position:absolute;right:18px;top:12px;display:flex;gap:6px;z-index:5">${btn('Print', { size: 'sm', act: 'print', icon: 'print', data: { fid } })}</div>`; }

const phs = (txt, why) => PH(txt, why);
/* ---- SCR-08 briefing card (PRINT, one A4) ---- */
function renderBriefing(w, ctx) {

  const banner = part ? `<div class="cut cut-s" style="--fill:var(--warning);--line:var(--warning);color:#fff;padding:8px 12px;font:700 14px var(--f-ui)">${sicon('warning', 'onfill')} Plan incomplete — not valid for use</div>` : over ? `<div class="cut cut-s" style="--fill:var(--bg);--line:var(--caution);padding:8px 12px;font:700 13px var(--f-ui)">${status('caution', { slot: 'banner', word: 'OVER LIMITS' })} <span style="font-weight:500">Exceeded: segment in darkness (sun below horizon)</span></div>` : '';
  const val = (k, o = {}) => part ? '<span class="num t3" data-provenance="modelled" title="totals omitted: plan incomplete">—</span>' : N(k, Object.assign({ chip: 'g', size: 15 }, o));
  const stopsRows = STOPS.map(x => `<tr><td class="mono">${x.n}</td><td>${x.code}<br><span class="t3">${STOPN[x.n].name ? esc(STOPN[x.n].name) : 'name TBD'}</span></td><td>${N('p_ltst_start', { chip: 'g', size: 12, unit: false })} / ${PH('##:##', 'TASK-06')}</td><td>${N('p_dwell', { chip: 'g', size: 12 })}</td><td>${N('p_sunel', { chip: 'g', size: 12 })}</td><td style="font-size:11px">${x.n === 2 ? 'Resource — ISRU water' : x.n === 3 ? 'Science — boxwork' : 'Engineering — terrain'}</td></tr>`).join('');
  const prof = `<div>${profileSVG({}, 714, 56, part ? 'partial' : 'ok')}</div>`;
  const tl = (sid, crew) => FX.tasks.list.filter(t => t.stop === sid && t.crew_id === crew).map(t => `${t.kind} — ${esc(t.text)}`).join('<br>');
  const tasksTbl = `<div><span class="mod">STOP TASKS (FR-50) ${chip('assumed', 'g', 'team-authored, PROPOSED copy')}</span><table class="tbl tight" style="font-size:10px;margin-top:2px"><tr><th>Stop</th><th>EV1</th><th>EV2</th></tr>${TSTOPS.map(sid => `<tr><td class="mono">${STOPN[tStopNo(sid)].code}</td><td>${tl(sid, 'EV1')}</td><td>${tl(sid, 'EV2')}</td></tr>`).join('')}</table></div>`;
  return `<div class="print"><div class="pg" data-ann="id:SCR-08|px:A4 portrait, 12 mm margins|note:Header · map + metrics · stops table · profile · warnings + assumptions · footer. Patterns kept for B/W printers">${printBar(ctx.fid)}
    <div class="row" style="justify-content:space-between;border-bottom:2px solid #111827;padding-bottom:6px"><div><span class="code">[ SCR-08 /// BRIEFING CARD ]</span><div class="disp" style="font-size:24px">Marswalk — plan “demo plan”</div></div><div class="kv" style="grid-template-columns:80px auto;font-size:11px"><span class="lbl">SITE</span><span>${esc(FX.site.site_id)}</span><span class="lbl">DATA</span><span class="mono">${esc(FX.site.data_version)}</span><span class="lbl">HASH</span>${N('p_hash', { chip: 'g', size: 11, unit: false })}<span class="lbl">GENERATED</span>${PH('####-##-##T##:##Z', 'TASK-11')}</div></div>${banner}
    <div style="display:grid;grid-template-columns:60% 1fr;gap:12px;flex:none"><div class="mapbox" style="height:235px;border:1px solid #111827">${briefMap(430, 235, { vb: [150, 480, 640, 350], route: part ? 'partial' : 'ok', L: { comm: true, pois: true }, stops: STOPS.map(x => ({ n: x.n, x: x.p[0], y: x.p[1], code: x.code })), poiLabels: false })}<span class="maptag">SCHEMATIC — not real terrain</span></div>
      <div class="col" style="gap:8px"><div>${part ? status('warning', { slot: 'card', word: 'PARTIAL' }) : over ? status('caution', { slot: 'card', word: 'OVER LIMITS' }) : status('nominal', { slot: 'card', word: 'PLAN OK' })}</div>${[['Distance', 'p_dist'], ['Walk time', 'p_walk'], ['EVA total', 'p_total'], ['Max slope', 'p_maxslope'], ['Max walkback', 'p_walkback'], ['Dose (solar max)', 'p_dose']].map(([l, k]) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--hairline)"><span class="lbl">${l}</span>${val(k)}</div>`).join('')}</div></div>
    <table class="tbl" style="font-size:12px"><tr><th>#</th><th>Stop</th><th>Arrive UTC / LTST</th><th>Dwell</th><th>Sun elev</th><th>Notes</th></tr>${stopsRows}</table>${tasksTbl}${prof}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><span class="mod">WARNINGS</span><ul style="font-size:12px;margin-top:4px"><li class="row" style="gap:6px;align-items:flex-start">${status('caution', { slot: 'card-w', word: 'CAUTION' })}<span>Slope 12.6° exceeds caution 10° for 80 m (05 §F.3)</span></li>${part ? `<li class="row" style="gap:6px;margin-top:4px">${status('warning', { slot: 'card-w', word: 'BLOCKED' })}<span>No feasible route on leg 2</span></li>` : ''}${over ? `<li class="row" style="gap:6px;margin-top:4px">${status('caution', { slot: 'card-w', word: 'CAUTION' })}<span>Segment in darkness</span></li>` : ''}</ul></div>
      <div><span class="mod">ASSUMPTIONS</span><div class="t2" style="font-size:12px;margin-top:4px">Suited ${N('speed_suit', { chip: 'g', size: 12 })} · hard/caution slope ${N('slope_hard', { chip: 'g', size: 12, unit: false })}/${N('slope_caut', { chip: 'g', size: 12 })} · walkback ${N('p_walkback_lim', { chip: 'g', size: 12 })} · haven rule ${N('haven_rule', { chip: 'g', size: 12 })} · dwell ${N('dwell_def', { chip: 'g', size: 12 })}. Defaults are assumptions — not flight rules.</div></div></div>
    <div class="noprint row" style="gap:8px;flex-wrap:wrap">${btn(pub ? 'Published to Hab Core ✓' : ico('ul') + 'Publish to Hab Core', { act: 'publish', size: 'tall', kind: 'primary', data: { fid: ctx.fid }, disabled: part })}${btn('Export plan JSON', { act: 'planJson', size: 'tall', data: { fid: ctx.fid } })}${btn('Back to map', { act: 'goto', data: { arg: 'scr-02' }, size: 'tall' })}${pub ? `<span class="row" style="gap:6px">${status('nominal', { slot: 'publish', word: 'PUBLISHED' })} <span style="font-size:12px">PUBLISH_PLAN ok · plan_revision ${N('rev_ph', { chip: 'g', size: 12, unit: false })} · hash ${N('p_hash', { chip: 'g', size: 12, unit: false })}</span></span>` : ''}${part ? '<span class="errtxt">Publishing is disabled: plan incomplete</span>' : ''}</div>
    ${w.ui.json ? `<pre style="font:11px/1.4 var(--f-mono);background:#F3F4F6;padding:8px;overflow:auto;max-height:200px;margin:0">${esc(planJson())}</pre>` : ''}
    <div class="sp"></div><div style="border-top:1px solid #111827;padding-top:6px;font-size:10.5px;color:var(--text-2)">Sources: USGS Gale merged DEM 1 m (DS—01), USGS orthophoto 25 cm (DS—02), THEMIS thermal inertia (DS—03), MSL RAD (DS—04). Credit NASA, USGS Astrogeology, ESA (Mars Express HRSC inside the DEM). ${esc(FX.meta.disclaimer)}</div></div></div>`;

/* ---- player ---- */
const PL = { cur: null, raf: 0, last: 0 };
function makePlayer(trackKey, w) {
  const tr = TRACKS[trackKey], P = { key: trackKey, tr, beats: tr.beats, idx: 0, t: 0, speed: 60, playing: false, paused: false, w, cb: new Set() };
  P.len = P.beats[P.beats.length - 1].s + 12;

  P.next = () => { if (P.idx < P.beats.length - 1) P.goto(P.idx + 1); else P.playing = false; };
  P.prev = () => P.goto(P.idx - 1);
  P.scrub = f => { P.t = f * P.len; let j = 0; P.beats.forEach((b, k) => { if (P.t >= b.s) j = k; }); P.goto(j, true); };
  P.tick = dt => { if (!P.playing || P.paused) return; P.t += dt * P.speed / 60; if (P.t >= P.len) { P.playing = false; P.t = P.len; P.cb.forEach(f => f(P)); return; } let j = P.idx; while (j + 1 < P.beats.length && P.t >= P.beats[j + 1].s) j++; if (j !== P.idx) P.goto(j, true); else P.cb.forEach(f => f(P)); };
  w.player = P; w.paused = P.paused; w.speed = P.speed;
  w.onCmd = (kind) => { if (kind !== 'summon') return false; const tgt = P.beats.findIndex(b => b.view.beat === 'k4'); if (tgt >= 0 && P.idx < tgt) { P.goto(tgt); return true; } return false; };
  return P;
}
function applyBeat(P) {
  const b = P.beats[P.idx], w = P.w, v = b.view; if (!v || v.k === 'card' || v.k === 'scr') { P.cb.forEach(f => f(P)); return; }
  const prev = w.disp ? JSON.parse(JSON.stringify(w.disp)) : null, ack = w.alerts.filter(a => a.acked).map(a => a.code);
  const ui = { hc: w.hc, muted: w.muted, tc: w.tapConfirm, speed: P.speed, paused: P.paused };
  KB[v.beat](w); w.hc = ui.hc; w.muted = ui.muted; w.tapConfirm = ui.tc; w.speed = P.speed; w.paused = P.paused; w.beat = v.beat; w.player = P;
  if (prev) w.disp = Object.assign({}, w.disp, Object.fromEntries(Object.keys(prev).filter(k => w.mk[k]).map(k => [k, prev[k]])));
  touch(w); startTween(w);
}
function playerLoop(ts) { if (!PL.cur) return; const dt = Math.min(0.1, (ts - (PL.last || ts)) / 1000); PL.last = ts; PL.cur.tick(dt); PL.raf = requestAnimationFrame(playerLoop); }
function playerStop() { cancelAnimationFrame(PL.raf); PL.raf = 0; PL.cur = null; PL.last = 0; }
function playerStart(P) { PL.cur = P; PL.last = 0; cancelAnimationFrame(PL.raf); PL.raf = requestAnimationFrame(playerLoop); }
